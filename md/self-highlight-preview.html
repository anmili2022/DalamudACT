<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自身星标颜色预览</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10141c;
      --panel: #171d28;
      --line: #2d384a;
      --text: #edf3ff;
      --muted: #9facbd;
      --accent: #7db7ff;
      --self-star: #ff8c00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1f2b3d, var(--bg) 58%);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(1100px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: 0.02em;
    }

    p { color: var(--muted); margin: 8px 0 18px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .card {
      background: color-mix(in srgb, var(--panel), transparent 4%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
    }

    .swatches {
      display: grid;
      gap: 9px;
    }

    button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #202938;
      color: var(--text);
      padding: 10px 12px;
      cursor: pointer;
      text-align: left;
      font: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    button:hover, button.active {
      border-color: var(--accent);
      background: #263449;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      flex: 0 0 auto;
    }

    .preview-window {
      background: rgba(6, 8, 12, 0.80);
      border: 1px solid #334052;
      border-radius: 14px;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 14px 0;
      border-bottom: 1px solid #263241;
    }

    .tab {
      padding: 7px 14px;
      border-radius: 9px 9px 0 0;
      background: #1e2734;
      color: #dce8f8;
      font-size: 14px;
    }

    .tab.active { background: #2f4057; color: #fff; }

    .table {
      padding: 14px;
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 190px 80px 110px 1fr;
      gap: 10px;
      align-items: center;
      color: #eef4ff;
      font-size: 15px;
    }

    .head {
      color: #9facbd;
      font-size: 13px;
      padding: 0 8px 4px;
    }

    .cell { padding: 0 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .bar {
      height: 26px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.10);
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--w);
      background: var(--bar);
    }

    .bar-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.65);
    }

    .star { color: var(--self-star); font-weight: 900; }

    .code {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #0c1118;
      border: 1px solid #293447;
      font-family: Consolas, "Cascadia Mono", monospace;
      color: #dce8f8;
      white-space: pre-wrap;
    }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1.2fr 0.7fr 0.8fr 1.4fr; font-size: 13px; gap: 4px; }
      .cell { padding: 0 4px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>自身星标颜色预览</h1>
    <p>模拟“高亮自身”只在名字前加星标，不改变占比条颜色。点击左侧颜色，右侧会同步预览星标。</p>

    <div class="layout">
      <section class="card">
        <h2>颜色切换</h2>
        <div class="swatches" id="swatches"></div>
        <div class="code" id="code"></div>
      </section>

      <section class="preview-window">
        <div class="tabs">
          <div class="tab active">DPS</div>
          <div class="tab">HPS</div>
          <div class="tab">承伤</div>
        </div>
        <div class="table">
          <div class="row head">
            <div>玩家</div><div>职业</div><div>伤害</div><div>占比</div>
          </div>
          <div class="row">
            <div class="cell name">队友A</div><div class="cell">武士</div><div class="cell">3.42M</div>
            <div class="bar" style="--w: 92%; --bar: #ef6a58;"><div class="fill"></div><div class="bar-text">32.7%</div></div>
          </div>
          <div class="row self">
            <div class="cell name"><span class="star">★</span> 自己的名字</div><div class="cell">黑魔</div><div class="cell">3.20M</div>
            <div class="bar" style="--w: 86%; --bar: #b77dff;"><div class="fill"></div><div class="bar-text">30.6%</div></div>
          </div>
          <div class="row">
            <div class="cell name">队友B</div><div class="cell">舞者</div><div class="cell">2.18M</div>
            <div class="bar" style="--w: 58%; --bar: #54c987;"><div class="fill"></div><div class="bar-text">20.8%</div></div>
          </div>
          <div class="row">
            <div class="cell name">队友C</div><div class="cell">贤者</div><div class="cell">1.25M</div>
            <div class="bar" style="--w: 34%; --bar: #7ba8f2;"><div class="fill"></div><div class="bar-text">11.9%</div></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const colors = [
      { name: '橙黄色', hex: '#ff8c00', vector: 'new Vector4(1.00f, 0.55f, 0.00f, 1f)' },
      { name: '深橙', hex: '#e66a00', vector: 'new Vector4(0.90f, 0.42f, 0.00f, 1f)' },
      { name: '琥珀金', hex: '#d68a00', vector: 'new Vector4(0.84f, 0.54f, 0.00f, 1f)' },
      { name: '亮红橙', hex: '#ff4f1f', vector: 'new Vector4(1.00f, 0.31f, 0.12f, 1f)' },
      { name: '品红', hex: '#ff3ea5', vector: 'new Vector4(1.00f, 0.24f, 0.65f, 1f)' },
      { name: '深蓝', hex: '#0057d9', vector: 'new Vector4(0.00f, 0.34f, 0.85f, 1f)' },
      { name: '黑色', hex: '#000000', vector: 'new Vector4(0.00f, 0.00f, 0.00f, 1f)' },
    ];

    const swatches = document.getElementById('swatches');
    const code = document.getElementById('code');

    function setColor(index) {
      const color = colors[index];
      document.documentElement.style.setProperty('--self-star', color.hex);
      code.textContent = color.vector;
      [...swatches.children].forEach((button, i) => button.classList.toggle('active', i === index));
    }

    colors.forEach((color, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.innerHTML = `<span>${color.name}</span><span class="dot" style="background:${color.hex}"></span>`;
      button.addEventListener('click', () => setColor(index));
      swatches.appendChild(button);
    });

    setColor(0);
  </script>
</body>
</html>
